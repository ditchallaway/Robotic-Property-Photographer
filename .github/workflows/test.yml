name: Snapshots

on:
  workflow_dispatch:
    inputs:
      job_json:
        description: 'Property boundary JSON string'
        required: true
        type: string
      callback_url:
        description: 'Webhook URL to notify upon completion'
        required: false
        type: string


jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build renderer image
        run: docker build -t rpp-renderer:ci .

      - name: Run render job (no /app bind mount)
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          JOB_JSON: ${{ inputs.job_json }}
        run: |
          set -euo pipefail
          mkdir -p output

          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ -n "$JOB_JSON" ]; then
            echo "$JOB_JSON" > /tmp/target-job.json
          else
            cp "${{ github.workspace }}/tests/fixtures/test-job.json" /tmp/target-job.json
          fi

          docker run --rm \
            -e GOOGLE_API_KEY \
            -v "${{ github.workspace }}/output:/app/output" \
            -v "/tmp/target-job.json:/tmp/target-job.json:ro" \
            rpp-renderer:ci \
            node bin/render.js /tmp/target-job.json --output /app/output/property.png

      - name: Verify expected outputs
        run: |
          set -euo pipefail
          test -f output/property_north.png
          test -f output/property_east.png
          test -f output/property_south.png
          test -f output/property_west.png
          test -f output/property_overhead.png
          ls -lah output/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: render-output
          path: output/*.png

      - name: Notify Webhook Callback
        if: ${{ inputs.callback_url != '' }}
        run: |
          curl -X POST -H "Content-Type: application/json" \
            -d "{\"run_id\": \"${{ github.run_id }}\"}" \
            "${{ inputs.callback_url }}"
