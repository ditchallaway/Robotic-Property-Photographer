version: '3.9'

services:
  moonshot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: moonshot-renderer
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - CESIUM_ION_TOKEN=${CESIUM_ION_TOKEN:-}
      - RENDER_TIMEOUT=120000
      - TILE_LOAD_TIMEOUT=120000
      - BLACK_FRAME_THRESHOLD=0.95
      - PUPPETEER_HEADLESS=true
    volumes:
      - ./logs:/app/logs
      - ./output:/app/output
    shm_size: '2gb'
    # Resource constraints for GPU environments
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - moonshot-net

networks:
  moonshot-net:
    driver: bridge
