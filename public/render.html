<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Robotic Property Photographer — Core Renderer</title>
    <script src="cesium/Cesium.js"></script>
    <link href="cesium/Widgets/widgets.css" rel="stylesheet">
    <style>
        html,
        body,
        #cesiumContainer {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: transparent;
        }
    </style>
</head>

<body>
    <div id="cesiumContainer"></div>
    <script>
        window.CESIUM_BASE_URL = 'cesium';

        let started = false;
        async function start() {
            if (started) return;
            started = true;
            const data = window.__MISSION_DATA__;
            if (!data) {
                console.error('[BROWSER] No MISSION_DATA found in window');
                return;
            }

            console.log('[BROWSER] Starting standalone renderer v2...');

            try {
                // 1. Initialize Viewer
                const viewer = new Cesium.Viewer('cesiumContainer', {
                    baseLayerPicker: false,
                    geocoder: false,
                    homeButton: false,
                    infoBox: false,
                    navigationHelpButton: false,
                    sceneModePicker: false,
                    selectionIndicator: false,
                    timeline: false,
                    animation: false,
                    fullscreenButton: false,
                    scene3DOnly: true,
                    contextOptions: {
                        webgl: {
                            preserveDrawingBuffer: true,
                            alpha: true
                        }
                    }
                });

                window.viewer = viewer;

                // --- Perfect Lighting & Atmosphere ---
                if (viewer.scene.skyAtmosphere) viewer.scene.skyAtmosphere.show = true;
                if (viewer.scene.fog) {
                    viewer.scene.fog.enabled = true;
                    viewer.scene.fog.density = 0.0002;
                }

                if (viewer.scene.globe) {
                    viewer.scene.globe.enableLighting = false; // "Perfect" uniform lighting
                    viewer.scene.globe.show = true;
                    viewer.scene.globe.baseColor = Cesium.Color.fromCssColorString('#111111');
                }
                if (viewer.scene.sun) viewer.scene.sun.show = false;
                if (viewer.scene.moon) viewer.scene.moon.show = false;
                if (viewer.scene.skyBox) viewer.scene.skyBox.show = false;
                if (viewer.creditContainer) viewer.creditContainer.style.display = 'none';

                // 2. Add Google 3D Tiles
                const apiKey = (data.google_api_key || '').trim();
                if (apiKey) {
                    try {
                        const tileset = await Cesium.Cesium3DTileset.fromUrl(
                            `https://tile.googleapis.com/v1/3dtiles/root.json?key=${apiKey}`
                        );
                        viewer.scene.primitives.add(tileset);
                        window.__TILESET__ = tileset;
                    } catch (e) {
                        console.error('[BROWSER] Tileset Load Error:', e.message);
                    }
                }

                // 3. Run single-pass mission
                await runMission(viewer, data);

            } catch (err) {
                console.error('[BROWSER] Fatal Renderer Error:', err.message);
                console.log('MISSION_ERROR');
            }
        }

        async function runMission(viewer, data) {
            const boundaryLineCollection = viewer.scene.primitives.add(new Cesium.PolylineCollection());
            const allPositions = [];
            const boundaryAlt = (data.centroid_elevation || 0) + 5;

            if (data.geometry && data.geometry.coordinates) {
                const rings = data.geometry.coordinates;
                const outerPositions = Cesium.Cartesian3.fromDegreesArray(rings[0].flat());
                allPositions.push(...outerPositions);

                for (let i = 0; i < rings.length; i++) {
                    const positions = [];
                    for (const coord of rings[i]) {
                        positions.push(Cesium.Cartesian3.fromDegrees(coord[0], coord[1], boundaryAlt));
                    }
                    boundaryLineCollection.add({
                        positions, width: 8,
                        material: Cesium.Material.fromType('Color', { color: Cesium.Color.YELLOW }),
                        show: true
                    });
                }
            }

            const origin = Cesium.Cartesian3.fromDegrees(data.centroid[0], data.centroid[1], data.centroid_elevation || 0);
            const boundingSphere = Cesium.BoundingSphere.fromPoints(allPositions);
            boundingSphere.center = origin;
            if (boundingSphere.radius < 50) boundingSphere.radius = 50;

            viewer.camera.frustum.fov = Cesium.Math.toRadians(100);
            if (viewer.scene.globe) viewer.scene.globe.maximumScreenSpaceError = 1.0;

            let shotList = [
                { name: 'nadir', heading: 0, pitch: -89.9 },
                { name: 'cardinal', heading: 0, pitch: -35 },
                { name: 'east', heading: 90, pitch: -35 },
                { name: 'south', heading: 180, pitch: -35 },
                { name: 'west', heading: 270, pitch: -35 }
            ];

            if (data.shots) shotList = shotList.filter(s => data.shots.includes(s.name));
            const tileset = window.__TILESET__;

            for (const shot of shotList) {
                console.log(`[BROWSER] === Shot: ${shot.name} ===`);
                const rangeMultiplier = (shot.pitch > -80) ? 2.5 : 2.0;
                viewer.camera.flyToBoundingSphere(boundingSphere, {
                    offset: new Cesium.HeadingPitchRange(
                        Cesium.Math.toRadians(shot.heading),
                        Cesium.Math.toRadians(shot.pitch),
                        boundingSphere.radius * rangeMultiplier
                    ),
                    duration: 0
                });

                try {
                    if (tileset) tileset.show = true;
                    if (viewer.scene && viewer.scene.globe) viewer.scene.globe.show = true;
                    if (viewer.scene) viewer.scene.backgroundColor = Cesium.Color.fromCssColorString('#87CEEB');
                } catch (e) {
                    console.warn('[BROWSER] Non-fatal visibility error:', e.message);
                }

                await waitForTiles(viewer, tileset);
                await window.capturePass(shot.name);
            }

            console.log('MISSION_COMPLETE');
        }

        async function waitForTiles(viewer, tileset) {
            return new Promise(resolve => {
                let stable = 0;
                const timer = setInterval(() => {
                    const tsLoaded = tileset ? (tileset.tilesLoaded || tileset.allTilesLoaded) : true;
                    const gLoaded = viewer.scene.globe.tilesLoaded;
                    if (tsLoaded && gLoaded) {
                        if (++stable >= 3) {
                            clearInterval(timer);
                            resolve();
                        }
                    } else {
                        stable = 0;
                    }
                }, 300);
                setTimeout(() => { clearInterval(timer); resolve(); }, 120000);
            });
        }

        if (window.__MISSION_DATA__) {
            start();
        } else {
            Object.defineProperty(window, '__MISSION_DATA__', {
                set: function (val) {
                    this._mission_data = val;
                    start();
                },
                get: function () { return this._mission_data; }
            });
        }
    </script>
</body>

</html>
