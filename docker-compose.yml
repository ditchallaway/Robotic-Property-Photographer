services:
  moonshot:
    build: .
    shm_size: '2gb'
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/public/cesium
      - ./output:/app/output
    environment:
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium
      - CESIUM_ION_TOKEN=${CESIUM_ION_TOKEN}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
    command: ["node", "src/server.js"]
